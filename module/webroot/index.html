<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<title>Any - CA</title>
<link rel="stylesheet" href="miuix.css">
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">

  <!-- ================= app bar ================= -->
  <header class="appbar">
    <div class="appbar-title" data-i18n="appName">Any - CA</div>
    <div class="appbar-actions">
      <button class="iconbtn" id="btnTheme" title="Theme" aria-label="Theme">
        <svg class="ic-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4l1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4l1.4-1.4"/></svg>
        <svg class="ic-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
      </button>
      <button class="iconbtn lang" id="btnLang" title="Language" aria-label="Language"><span id="langCode">en</span></button>
      <button class="iconbtn" id="btnAbout" title="About" aria-label="About">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"><circle cx="12" cy="12" r="9.5"/><path d="M12 16v-4.5M12 8h.01"/></svg>
      </button>
    </div>
  </header>

  <!-- ================= status hero ================= -->
  <section class="hero" id="hero" data-color="red">
    <div class="hero-top">
      <div class="hero-dot">
        <svg class="ic-ok" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></svg>
        <svg class="ic-warn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5m0 3h.01"/><circle cx="12" cy="12" r="9.5"/></svg>
        <svg class="ic-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9.5"/><path d="M8 12h8"/></svg>
      </div>
      <div class="hero-body">
        <p class="hero-title" id="heroTitle">—</p>
        <p class="hero-sub" id="heroSub">—</p>
      </div>
    </div>
    <div class="hero-counts">
      <div class="count-item">
        <span class="count-num" id="cntTotal">0</span>
        <span class="count-label" data-i18n="total">Total</span>
      </div>
      <div class="count-item">
        <span class="count-num" id="cntActive">0</span>
        <span class="count-label" data-i18n="active">Active</span>
      </div>
    </div>
  </section>

  <!-- ================= busy ================= -->
  <div class="busy" id="busy" hidden>
    <div class="spinner"></div>
    <span id="busyText">Working…</span>
  </div>

  <!-- ================= actions ================= -->
  <div class="actions">

    <button class="big-btn" id="btnImportCa">
      <span class="bb-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M9 15l2 2 4-4"/></svg>
      </span>
      <span class="bb-text">
        <span class="bb-title" data-i18n="importCa">Trust a CA certificate</span>
        <span class="bb-sub" data-i18n="importCaSub">Pick a PEM/DER certificate and add it to the system store</span>
      </span>
    </button>

  </div>

  <!-- ================= list ================= -->
  <div class="section-title">
    <span data-i18n="certList">Certificates</span>
  </div>
  <div class="list" id="list"></div>

  <div class="empty" id="empty" hidden>
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M21 8v13H3V8M1 3h22v5H1zM10 12h4"/></svg>
    <p data-i18n="emptyList">Nothing here yet</p>
  </div>

</div>

<!-- ================= modal root ================= -->
<div id="modalRoot"></div>
<div id="toast" hidden></div>

<script src="i18n.js"></script>
<script src="i18n.zh.js"></script>
<script src="i18n.ja.js"></script>
<script src="i18n.ko.js"></script>
<script src="i18n.de.js"></script>
<script src="i18n.fr.js"></script>
<script src="i18n.es.js"></script>
<script src="i18n.ru.js"></script>
<script src="i18n.core.js"></script>
<script src="hashlib.js"></script>
<script src="app.js"></script>
<script src="app2.js"></script>
</body>
</html>
